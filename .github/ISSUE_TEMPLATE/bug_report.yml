name: Bug report
description: Report reproducible unexpected behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, pairing codes, real transcripts or private hostnames. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Bun, Claude Code and trine commit/version. Remove identifying paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
