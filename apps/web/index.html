<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover：PWA standalone 下内容铺到刘海/圆角区，
         安全区由 styles.css 的 .safe-top / .safe-bottom 让出来 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- 初值取深色 token 的 --phone-bg；app/theme.ts 会按实际主题实时改写 -->
    <meta name="theme-color" content="#12181F" />
    <meta name="description" content="Claude Code 远程操控客户端" />

    <!-- iOS：加到主屏后全屏运行，状态栏跟随页面配色 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="trine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>trine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
